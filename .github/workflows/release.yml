name: release

# Builds Brood's macOS installer package (Universal: VST3, Audio Unit, standalone).
# A tag like v0.2.0 makes a draft release with the package attached, to check and
# publish by hand. Run it from the Actions tab to get the package as an artifact only.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Version
        id: version
        run: echo "version=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"

      - name: Build the installer package
        run: bash scripts/package-macos.sh "${{ steps.version.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: Brood-macOS
          path: release/*.pkg

      - name: Draft a release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/*.pkg --draft --title "Brood $GITHUB_REF_NAME" --generate-notes
